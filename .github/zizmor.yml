# zizmor's configuration. Every ignore here is for release.yml, which dist
# generates: its findings are handled here, never by editing it (a
# hand-edited workflow makes `dist plan` fail on pull requests). Ignores are
# by file, not line, so they survive `dist generate` moving lines around.
rules:
  # dist needs `contents: write` to publish the release. On a pull request
  # from a fork, GitHub makes the token read-only anyway.
  excessive-permissions:
    ignore:
      - release.yml
  # Expansions are the maintainer-selected workflow_dispatch tag or the
  # build matrix computed from this repository's dist config. Dispatch is
  # restricted to repository writers; PRs only plan and cannot publish.
  template-injection:
    ignore:
      - release.yml
  # dist runs a Linux build in a container only when [dist.github-custom-runners]
  # gives its target one, and that table names only aarch64-apple-darwin.
  unpinned-images:
    ignore:
      - release.yml
