# Fast checks for every pull request and push to the maintained branches.
#
# The integration tests (tests/*.rs) run against real Rex servers, and Rex is
# a private beta: CI never installs, downloads or references it. They're only
# compiled here. Run them locally with `cargo test`; release acceptance also
# runs them against the actual packaged binary.

name: CI

on:
  pull_request:
    branches: [main, fork-release]
  push:
    branches: [main, fork-release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings

  doc:
    # For a binary crate, documenting private items is the only way rustdoc
    # checks the intra-doc links.
    name: Doc links
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Unit tests (integration tests compiled only; they need Rex, run `cargo test` locally)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Unit tests
        run: cargo test --bins --locked
      - name: Compile the integration tests without running them
        run: cargo test --tests --no-run --locked
      - name: Say what didn't run
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          **The integration tests didn't run.** They run against real Rex servers, and CI
          has no Rex, so they were only compiled. Run them locally, with `rex` on `PATH`:

          ```sh
          cargo test
          ```
          SUMMARY

  linux:
    # The Linux-only code (reading /proc, the systemd timer's Linux defaults)
    # and its unit tests aren't compiled on macOS. Rex runs on Linux too, but
    # CI still has no Rex, so here too the integration tests are only compiled.
    name: Linux (clippy, unit tests; integration tests compiled only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --bins --locked
      - name: Compile the integration tests without running them
        run: cargo test --tests --no-run --locked

  recorder:
    name: Shell syntax and legacy migration tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: for file in rexurrect.plugin.zsh scripts/migrate-legacy-install.zsh scripts/test-migrate-legacy-install.zsh; do zsh -n "$file" || exit; done
      - run: zsh scripts/test-migrate-legacy-install.zsh

  deny:
    name: Dependency policy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny-action runs in Docker, which macOS runners don't have.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  msrv:
    name: Minimum Rust version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the declared minimum consistent with the pinned CI toolchain.
      - name: Confirm the declared minimum
        run: test "$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" = '1.89'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --all-targets --locked

  typos:
    name: Typos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  zizmor:
    # Lints this workflow and dist's release workflow. Findings in dist's
    # generated workflow are handled in .github/zizmor.yml, never by editing it.
    name: Workflow security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Annotations need no permission to upload to code scanning.
          advanced-security: false
          annotations: true
